<!doctype html>
<html lang="%lang%" data-theme="%theme%">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<meta name="color-scheme" content="light dark" />
		<meta name="theme-color" content="#F5F5F7" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
		<link rel="preconnect" href="https://raw.githubusercontent.com" crossorigin />
		<link rel="dns-prefetch" href="https://raw.githubusercontent.com" />
		<link rel="preconnect" href="https://img.youtube.com" crossorigin />
		<link rel="dns-prefetch" href="https://img.youtube.com" />
		<script>
			try {
				const theme = localStorage.getItem('theme');
				if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
					document.documentElement.classList.add('dark');
				}
			} catch (e) {}

			// Production noise filter: Suppress third-party iframe & extension noise
			if (location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
				window.addEventListener('error', function(event) {
					if (event.filename && (event.filename.includes('chrome-extension') || event.filename.includes('moz-extension') || event.filename.includes('youtube.com'))) {
						event.preventDefault();
					}
				});
				window.addEventListener('unhandledrejection', function(event) {
					if (event.reason && (event.reason.name === 'AbortError' || String(event.reason).includes('postMessage'))) {
						event.preventDefault();
					}
				});
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
